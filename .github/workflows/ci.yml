name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: build/package-lock.json

      - name: Install build dependencies
        run: npm ci --prefix build

      - name: Build CSS
        run: npm run build --prefix build

      - name: Verify committed CSS is up to date
        run: |
          if ! git diff --quiet -- styles/wod5e-hud.css; then
            echo "::error::Compiled CSS is out of date. Run 'npm run build' in build/ and commit styles/wod5e-hud.css."
            git diff --stat -- styles/wod5e-hud.css
            exit 1
          fi

      - name: Syntax check
        run: |
          node --check scripts/module.mjs
          find scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Check formatting
        run: |
          npx --yes prettier@3.3.3 --check \
            "scripts/**/*.mjs" \
            "lang/*.json" \
            "module.json" \
            "README.md" \
            "build/src/input.css" \
            "build/tailwind.config.mjs" \
            "build/package.json"
